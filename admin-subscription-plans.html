<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Subscription Plans Management</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/lab-theme.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts/supabase-config.js"></script>
</head>
<body class="lab-theme">
    <div class="admin-container">
        <header class="admin-header">
            <h1>📊 Subscription Plans Management</h1>
            <p>Manage your subscription plans and pricing</p>
        </header>

        <div class="admin-content">
            <!-- Add New Plan Form -->
            <section class="admin-section">
                <h2>➕ Add New Plan</h2>
                <form id="addPlanForm" class="admin-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="planName">Plan Name</label>
                            <input type="text" id="planName" name="name" required placeholder="e.g., Premium Plan">
                        </div>
                        <div class="form-group">
                            <label for="planType">Plan Type</label>
                            <select id="planType" name="plan_type" required>
                                <option value="free">Free</option>
                                <option value="professional">Professional</option>
                                <option value="enterprise">Enterprise</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="planPrice">Price (in cents)</label>
                            <input type="number" id="planPrice" name="price" required placeholder="4900 for $49.00">
                        </div>
                        <div class="form-group">
                            <label for="planInterval">Billing Interval</label>
                            <select id="planInterval" name="interval" required>
                                <option value="month">Monthly</option>
                                <option value="year">Yearly</option>
                                <option value="lifetime">Lifetime</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="planTrialDays">Trial Days</label>
                            <input type="number" id="planTrialDays" name="trial_days" min="0" placeholder="7">
                        </div>
                        <div class="form-group">
                            <label for="planMaxAccounts">Max Instagram Accounts</label>
                            <input type="number" id="planMaxAccounts" name="max_instagram_accounts" min="1" value="1">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="planDescription">Description</label>
                        <textarea id="planDescription" name="description" rows="3" placeholder="Plan description..."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="planFeatures">Features (JSON array)</label>
                        <textarea id="planFeatures" name="features" rows="4" placeholder='["Feature 1", "Feature 2", "Feature 3"]'></textarea>
                        <small>Enter features as a JSON array. Leave empty for default features.</small>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary">Add Plan</button>
                        <button type="button" class="btn-secondary" onclick="resetForm()">Reset</button>
                    </div>
                </form>
            </section>

            <!-- Current Plans -->
            <section class="admin-section">
                <h2>📋 Current Plans</h2>
                <div id="plansList" class="plans-list">
                    <div class="loading">Loading plans...</div>
                </div>
            </section>

            <!-- Quick Actions -->
            <section class="admin-section">
                <h2>⚡ Quick Actions</h2>
                <div class="quick-actions">
                    <button class="btn-action" onclick="refreshPlans()">🔄 Refresh Plans</button>
                    <button class="btn-action" onclick="exportPlans()">📤 Export Plans</button>
                    <button class="btn-action" onclick="showDefaultPlans()">📋 Show Default Plans</button>
                </div>
            </section>
        </div>
    </div>

    <script src="scripts/admin-subscription-plans.js"></script>
</body>
</html>
