<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In / Sign Up - Instaflow</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="lab-theme.css">
    <link rel="stylesheet" href="auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
</head>
<body class="lab-theme">
    <!-- Background Elements -->
    <div class="auth-background">
        <div class="floating-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
            <div class="shape shape-4"></div>
            <div class="shape shape-5"></div>
        </div>
        <div class="gradient-orbs">
            <div class="orb orb-1"></div>
            <div class="orb orb-2"></div>
            <div class="orb orb-3"></div>
        </div>
    </div>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="index.html" class="logo-link" onclick="handleLogoClick(); return false;">
                    <h2 class="logo-text">Instaflow</h2>
                </a>
            </div>
                        <div class="nav-links">
            <a href="features-new.html" class="nav-link">Features</a>
            <a href="download.html" class="nav-link">Download</a>
            <a href="guide.html" class="nav-link">Guide</a>
            
            <a href="partners.html" class="nav-link">Partners</a>
            <a href="contact.html" class="nav-link">Contact</a>
                            <a href="pricing.html" class="nav-link pricing-link">Get Pro</a>
        </div>
            <div class="nav-auth">
                <!-- Guest State (when not logged in) -->
                <div class="auth-buttons guest-state">
                    <a href="auth.html" class="auth-btn signin-btn">Sign In</a>
                    <a href="auth.html?form=signup" class="auth-btn signup-btn">Sign Up</a>
                </div>
                
                <!-- Logged In State (when user is authenticated) -->
                <div class="auth-buttons logged-in-state" style="display: none;">
                    <div class="profile-menu">
                        <button class="profile-btn" onclick="toggleProfileMenu()">
                            <span class="profile-avatar">👤</span>
                            <span class="profile-name">User</span>
                            <span class="profile-arrow">▼</span>
                        </button>
                        <div class="profile-dropdown" id="profile-dropdown">
                                                        <a href="profile.html" class="dropdown-item">
                            <span class="item-icon">👤</span>
                            Profile
                        </a>
                        <a href="admin-dashboard.html" class="dropdown-item admin-only" style="display: none;">
                            <span class="item-icon">📊</span>
                            Dashboard
                        </a>
                            <a href="#" class="dropdown-item">
                                <span class="item-icon">💳</span>
                                Billing
                            </a>
                            <div class="dropdown-divider"></div>
                            <a href="#" class="dropdown-item logout-btn" onclick="handleLogout()">
                                <span class="item-icon">🚪</span>
                                Sign Out
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Auth Container -->
    <div class="auth-container">
        <div class="auth-card">
            <!-- Logo Section -->
            <div class="auth-logo">
                <div class="logo-circle">
                    <span class="logo-icon">⚡</span>
                </div>
                <h1 class="auth-title">Welcome to Instaflow</h1>
                <p class="auth-subtitle">Your Instagram automation journey starts here</p>
            </div>

            <!-- Form Container -->
            <div class="form-container">
                <!-- Sign In Form -->
                <form id="signin-form" class="auth-form active">
                    <div class="form-group">
                        <div class="input-wrapper">
                            <span class="input-icon">📧</span>
                            <input type="email" placeholder="Email address" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <div class="input-wrapper">
                            <span class="input-icon">🔒</span>
                            <input type="password" placeholder="Password" required>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-wrapper">
                            <input type="checkbox">
                            <span class="checkmark"></span>
                            Remember me
                        </label>
                        <a href="#" class="forgot-link">Forgot password?</a>
                    </div>

                    <button type="submit" class="submit-btn">
                        <span class="btn-text">Sign In</span>
                        <span class="btn-arrow">→</span>
                    </button>

                    <div class="social-auth">
                        <p class="social-text">Or continue with</p>
                        <div class="social-buttons">
                            <button type="button" class="social-btn google">
                                <span class="social-icon">🔍</span>
                                Google
                            </button>
                            <button type="button" class="social-btn github">
                                <span class="social-icon">🐙</span>
                                GitHub
                            </button>
                        </div>
                    </div>
                </form>

                <!-- Sign Up Form -->
                <form id="signup-form" class="auth-form">
                    <div class="form-group">
                        <div class="input-wrapper">
                            <span class="input-icon">👤</span>
                            <input type="text" placeholder="Full name" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="input-wrapper">
                            <span class="input-icon">📧</span>
                            <input type="email" placeholder="Email address" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <div class="input-wrapper">
                            <span class="input-icon">🔒</span>
                            <input type="password" placeholder="Create password" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="input-wrapper">
                            <span class="input-icon">🔒</span>
                            <input type="password" placeholder="Confirm password" required>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-wrapper">
                            <input type="checkbox" required>
                            <span class="checkmark"></span>
                            I agree to the <a href="#" class="terms-link">Terms of Service</a> and <a href="#" class="terms-link">Privacy Policy</a>
                        </label>
                    </div>

                    <button type="submit" class="submit-btn">
                        <span class="btn-text">Create Account</span>
                        <span class="btn-arrow">→</span>
                    </button>

                    <div class="social-auth">
                        <p class="social-text">Or sign up with</p>
                        <div class="social-buttons">
                            <button type="button" class="social-btn google">
                                <span class="social-icon">🔍</span>
                                Google
                            </button>
                            <button type="button" class="social-btn github">
                                <span class="social-icon">🐙</span>
                                GitHub
                            </button>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Back to Home -->
            <div class="back-home">
                <a href="index.html" class="back-link">
                    <span class="back-icon">←</span>
                    Back to Home
                </a>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    
    <script>
        // Logo click handler for navigation
        function handleLogoClick() {
            console.log('Logo clicked, navigating to home page');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
