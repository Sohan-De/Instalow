<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Instalow</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(1200px 800px at 20% -10%, rgba(20,255,114,0.2), transparent),
                        radial-gradient(1000px 900px at 120% 10%, rgba(0,255,136,0.15), transparent),
                        linear-gradient(180deg, #071b0f 0%, #03140b 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            color: #e9ffee;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="50" cy="50" r="1" fill="white" opacity="0.1"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>');
            pointer-events: none;
            z-index: 1;
        }

        .profile-container {
            position: relative;
            z-index: 2;
            max-width: 900px;
            margin: 30px auto;
            padding: 40px;
            background: rgba(7, 27, 15, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.3),
                0 0 0 1px rgba(20, 255, 114, 0.2);
            border: 1px solid rgba(20, 255, 114, 0.3);
        }

        .profile-header {
            text-align: center;
            margin-bottom: 50px;
            position: relative;
        }

        .profile-header::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, #00ff88, #e6c14a);
            border-radius: 2px;
        }

        .profile-header h1 {
            color: #e9ffee;
            margin-bottom: 15px;
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(90deg, #e6c14a, #fff1a8, #00ff88, #e6c14a);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: titleShine 6s linear infinite;
        }

        .profile-header p {
            color: #b8f5d3;
            font-size: 1.1rem;
            font-weight: 400;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid rgba(20, 255, 114, 0.2);
            border-top: 4px solid #00ff88;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Custom styles for disabled plan type field */
        .plan-type-disabled {
            background-color: #1a1a1a !important;
            color: #666 !important;
            border: 1px solid #333 !important;
            cursor: not-allowed !important;
            opacity: 0.7;
        }

        .plan-type-disabled option {
            background-color: #1a1a1a;
            color: #666;
        }

        .plan-type-help-text {
            color: #888;
            font-size: 12px;
            margin-top: 5px;
            display: block;
            font-style: italic;
        }

        .plan-type-container {
            position: relative;
        }

        .plan-type-lock-icon {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            font-size: 14px;
            pointer-events: none;
        }

        .profile-info {
            background: linear-gradient(135deg, rgba(7, 27, 15, 0.8) 0%, rgba(3, 20, 11, 0.8) 100%);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 40px;
            border: 1px solid rgba(20, 255, 114, 0.3);
            position: relative;
            overflow: hidden;
        }

        .profile-info::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #00ff88, #e6c14a);
        }

        .profile-info h3 {
            margin-bottom: 25px;
            color: #e9ffee;
            font-size: 1.5rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .profile-info h3::before {
            content: '👤';
            font-size: 1.2rem;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(20, 255, 114, 0.1);
            border-radius: 15px;
            border: 1px solid rgba(20, 255, 114, 0.3);
            transition: all 0.3s ease;
        }

        .info-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(20, 255, 114, 0.2);
            border-color: #00ff88;
        }

        .info-label {
            font-weight: 500;
            color: #b8f5d3;
            font-size: 0.95rem;
        }

        .info-value {
            color: #e9ffee;
            font-weight: 600;
            font-size: 0.95rem;
            max-width: 200px;
            text-align: right;
            word-break: break-word;
        }

        .action-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            position: relative;
            overflow: hidden;
            min-width: 140px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(45deg, #00ff88, #e6c14a);
            color: #071b0f;
            box-shadow: 0 8px 25px rgba(20, 255, 114, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(20, 255, 114, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(45deg, #e6c14a, #00ff88);
            color: #071b0f;
            box-shadow: 0 8px 25px rgba(230, 193, 74, 0.3);
        }

        .btn-secondary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(230, 193, 74, 0.4);
        }

        .profile-form {
            display: grid;
            gap: 30px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
        }

        .profile-form.active {
            opacity: 1;
            transform: translateY(0);
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 12px;
            color: #b8f5d3;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group label::before {
            font-size: 1.1rem;
        }

        .form-group:nth-child(1) label::before { content: '👤'; }
        .form-group:nth-child(2) label::before { content: '📧'; }
        .form-group:nth-child(3) label::before { content: '📱'; }
        .form-group:nth-child(4) label::before { content: '💬'; }
        .form-group:nth-child(5) label::before { content: '💎'; }
        .form-group:nth-child(6) label::before { content: '📊'; }

        .form-group input,
        .form-group textarea {
            padding: 18px 20px;
            border: 2px solid rgba(20, 255, 114, 0.3);
            border-radius: 15px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: linear-gradient(45deg, rgba(0, 255, 136, 0.1), rgba(230, 193, 74, 0.1));
            backdrop-filter: blur(10px);
            color: #e9ffee;
        }

        .form-group select {
            padding: 18px 20px;
            border: 2px solid rgba(20, 255, 114, 0.3);
            border-radius: 15px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: linear-gradient(45deg, rgba(0, 255, 136, 0.1), rgba(230, 193, 74, 0.1));
            backdrop-filter: blur(10px);
            color: #e9ffee;
            cursor: pointer;
            position: relative;
        }

        .form-group input:hover,
        .form-group textarea:hover {
            border-color: #00ff88;
            background: linear-gradient(45deg, rgba(0, 255, 136, 0.15), rgba(230, 193, 74, 0.15));
            transform: translateY(-1px);
        }

        .form-group select:hover {
            border-color: #00ff88;
            background: linear-gradient(45deg, rgba(0, 255, 136, 0.15), rgba(230, 193, 74, 0.15));
            transform: translateY(-1px);
        }

        .form-group select:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 0 3px rgba(20, 255, 114, 0.1);
            transform: translateY(-2px);
            background: linear-gradient(45deg, rgba(0, 255, 136, 0.2), rgba(230, 193, 74, 0.2));
        }

        /* Custom dropdown arrow */
        .form-group select {
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%2300ff88' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='m6 8 4 4 4-4'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 20px;
            padding-right: 50px;
        }

        /* Custom dropdown styling */
        .form-group select {
            border-radius: 15px;
            background-size: 20px;
            background-position: right 15px center;
            background-repeat: no-repeat;
            padding-right: 50px;
        }

        /* Dropdown options styling - Note: border-radius doesn't work on select options in most browsers */
        .form-group select option {
            background: #071b0f;
            color: #e9ffee;
            border: 1px solid rgba(20, 255, 114, 0.3);
            padding: 12px;
        }

        .form-group select option:hover {
            background: rgba(0, 255, 136, 0.2);
        }

        .form-group select option:checked {
            background: linear-gradient(45deg, #00ff88, #e6c14a);
            color: #071b0f;
            font-weight: 600;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 0 3px rgba(20, 255, 114, 0.1);
            transform: translateY(-2px);
            background: linear-gradient(45deg, rgba(0, 255, 136, 0.2), rgba(230, 193, 74, 0.2));
        }

        .form-group select:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 0 3px rgba(20, 255, 114, 0.1);
            transform: translateY(-2px);
            background: linear-gradient(45deg, rgba(0, 255, 136, 0.2), rgba(230, 193, 74, 0.2));
        }

        .form-group input[readonly] {
            background: rgba(3, 20, 11, 0.8);
            color: #b8f5d3;
            cursor: not-allowed;
        }

        /* Placeholder styling */
        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: rgba(184, 245, 211, 0.6);
            font-style: italic;
        }

        .form-group input:focus::placeholder,
        .form-group textarea:focus::placeholder {
            color: rgba(184, 245, 211, 0.8);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .submit-btn {
            background: linear-gradient(45deg, #00ff88, #e6c14a);
            color: #071b0f;
            padding: 18px 40px;
            border: none;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(20, 255, 114, 0.3);
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .submit-btn:hover::before {
            left: 100%;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(20, 255, 114, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .edit-mode {
            display: none;
        }

        .edit-mode.active {
            display: block;
        }

        .view-mode {
            display: block;
        }

        .view-mode.hidden {
            display: none;
        }

        .notification {
            position: fixed;
            top: 30px;
            right: 30px;
            padding: 20px 25px;
            border-radius: 15px;
            color: white;
            font-weight: 600;
            z-index: 1000;
            transform: translateX(100%);
            transition: all 0.4s ease;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.success {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            border: 1px solid rgba(72, 187, 120, 0.3);
        }

        .notification.error {
            background: linear-gradient(135deg, #f56565 0%, #e53e3e 100%);
            border: 1px solid rgba(245, 101, 101, 0.3);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .profile-container {
                margin: 20px;
                padding: 25px;
            }

            .profile-header h1 {
                font-size: 2rem;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .action-buttons {
                flex-direction: column;
                align-items: center;
            }

            .btn {
                width: 100%;
                max-width: 300px;
            }
        }

        /* Floating Elements Animation */
        .floating-element {
            position: absolute;
            opacity: 0.15;
            animation: float 6s ease-in-out infinite;
            color: #00ff88;
            text-shadow: 0 0 10px rgba(20, 255, 114, 0.5);
        }

        .floating-element:nth-child(1) {
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .floating-element:nth-child(2) {
            top: 20%;
            right: 15%;
            animation-delay: 2s;
            color: #e6c14a;
            text-shadow: 0 0 10px rgba(230, 193, 74, 0.5);
        }

        .floating-element:nth-child(3) {
            bottom: 20%;
            left: 15%;
            animation-delay: 4s;
            color: #14ff72;
            text-shadow: 0 0 10px rgba(20, 255, 114, 0.5);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        @keyframes titleShine {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body>
    <!-- Floating decorative elements -->
    <div class="floating-element">🌟</div>
    <div class="floating-element">💫</div>
    <div class="floating-element">✨</div>

    <div class="profile-container">
        <div class="profile-header">
            <h1>Your Profile</h1>
            <p>Manage your Instalow account settings with style</p>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Loading your profile...</p>
        </div>

        <div class="profile-info view-mode" id="viewMode">
            <h3>Profile Information</h3>
            <div class="info-grid">
                <div class="info-item">
                    <span class="info-label">Full Name</span>
                    <span class="info-value" id="displayName">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Email</span>
                    <span class="info-value" id="displayEmail">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Instagram Username</span>
                    <span class="info-value" id="displayInstagram">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Plan Type</span>
                    <span class="info-value" id="displayPlan">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Bio</span>
                    <span class="info-value" id="displayBio">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Member Since</span>
                    <span class="info-value" id="displayCreated">-</span>
                </div>
            </div>
            <div class="action-buttons">
                <button class="btn btn-primary" onclick="enableEditMode()">✏️ Edit Profile</button>
                <button class="btn btn-secondary" onclick="goToHome()">🏠 Back to Home</button>
            </div>
        </div>

        <form class="profile-form edit-mode" id="editMode">
            <div class="form-row">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" required placeholder="Enter your full name">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required readonly>
                </div>
            </div>

            <div class="form-group">
                <label for="instagramUsername">Instagram Username</label>
                <input type="text" id="instagramUsername" name="instagramUsername" placeholder="@your_username">
            </div>

            <div class="form-group">
                <label for="bio">Bio</label>
                <textarea id="bio" name="bio" rows="4" placeholder="Tell us about yourself and your Instagram journey..."></textarea>
            </div>

            <div class="form-row">
                <div class="form-group plan-type-container">
                    <label for="planType">Plan Type</label>
                    <select id="planType" name="planType" class="plan-type-disabled" disabled>
                        <option value="free">🚀 Free Plan</option>
                        <option value="professional">💎 Professional</option>
                        <option value="enterprise">🏢 Enterprise</option>
                    </select>
                    <span class="plan-type-lock-icon">🔒</span>
                    <small class="plan-type-help-text">
                        Plan type cannot be changed. Contact support to upgrade.
                    </small>
                </div>
                <div class="form-group">
                    <label for="planStatus">Plan Status</label>
                    <select id="planStatus" name="planStatus">
                        <option value="active">✅ Active</option>
                        <option value="cancelled">❌ Cancelled</option>
                        <option value="expired">⏰ Expired</option>
                    </select>
                </div>
            </div>

            <div class="action-buttons">
                <button type="submit" class="submit-btn">💾 Save Changes</button>
                <button type="button" class="btn btn-secondary" onclick="cancelEdit()">❌ Cancel</button>
            </div>
        </form>
    </div>

    <div id="notification" class="notification"></div>

    <script src="profile.js"></script>
</body>
</html>
